<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 立方体与画板</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }
        
        button {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            background: linear-gradient(45deg, #3cb0fd, #3498db);
        }
        
        h1 {
            margin-top: 0;
            color: #3498db;
            text-align: center;
        }
        
        .color-picker {
            display: flex;
            gap: 5px;
            margin: 10px 0;
        }
        
        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            transition: transform 0.2s;
        }
        
        .color-option:hover {
            transform: scale(1.2);
        }
        
        .color-option.active {
            transform: scale(1.2);
            box-shadow: 0 0 10px white;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="info">
            <h1>3D 画板与立方体</h1>
            <p>在画板上绘制线条，线条将自动投影到画板平面上。</p>
            <p><strong>操作指南：</strong></p>
            <ul>
                <li>按住鼠标左键在画板上绘制</li>
                <li>鼠标滚轮缩放场景</li>
                <li>按住鼠标右键旋转视角</li>
                <li>按住中键平移场景</li>
            </ul>
            <div class="color-picker">
                <div class="color-option active" style="background-color: #e74c3c;" data-color="#e74c3c"></div>
                <div class="color-option" style="background-color: #3498db;" data-color="#3498db"></div>
                <div class="color-option" style="background-color: #2ecc71;" data-color="#2ecc71"></div>
                <div class="color-option" style="background-color: #f1c40f;" data-color="#f1c40f"></div>
                <div class="color-option" style="background-color: #9b59b6;" data-color="#9b59b6"></div>
            </div>
        </div>
        
        <div id="controls">
            <button id="clear-btn">清除画板</button>
            <button id="toggle-grid">显示/隐藏网格</button>
            <button id="toggle-cube">显示/隐藏立方体</button>
            <button id="toggle-controls">开启/关闭控制器</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script>
        // 场景初始化
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0c0f2e);
        
        // 相机设置
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 10);
        
        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // 轨道控制器
        let controls;
        function createControls() {
          controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.05;
        }

        function destroyControls() {
          if (controls) {
            controls.dispose();
            controls = null;
          }
        }
 
        
        // 光源设置
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);
        
        // 创建立方体
        const cubeGeometry = new THREE.BoxGeometry(2, 2, 2);
        const cubeMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x3498db,
            transparent: true,
            opacity: 0.8,
            shininess: 100
        });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.z = -1;
        scene.add(cube);
        
        // 创建画板
        const canvasPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 3);
        const canvasGeometry = new THREE.PlaneGeometry(8, 5);
        const canvasMaterial = new THREE.MeshBasicMaterial({
            color: 0x222222,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.7
        });
        const canvasMesh = new THREE.Mesh(canvasGeometry, canvasMaterial);
        canvasMesh.position.z = -3;
        canvasMesh.rotation.x = Math.PI / 2;
        scene.add(canvasMesh);
        
        // 画板网格
        const gridHelper = new THREE.GridHelper(8, 20, 0x444444, 0x222222);
        gridHelper.position.z = -3;
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);
        
        // 绘制状态变量
        let isDrawing = false;
        let currentLine = null;
        let points = [];
        let lines = [];
        let drawColor = new THREE.Color(0xe74c3c);
        
        // 鼠标事件处理
        function onMouseDown(event) {
            if (event.button !== 0) return; // 只响应左键
            
            isDrawing = true;
            points = [];
            
            const material = new THREE.LineBasicMaterial({
                color: drawColor,
                linewidth: 2
            });
            
            const geometry = new THREE.BufferGeometry();
            currentLine = new THREE.Line(geometry, material);
            scene.add(currentLine);
            lines.push(currentLine);
        }
        
        function onMouseMove(event) {
            if (!isDrawing) return;
            
            // 获取鼠标位置
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // 射线检测
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            // 计算与画板的交点
            const intersection = new THREE.Vector3();
            raycaster.ray.intersectPlane(canvasPlane, intersection);
            
            // 添加点到当前线条
            points.push(intersection.clone());
            
            // 更新线条几何体
            const positions = new Float32Array(points.length * 3);
            points.forEach((point, i) => {
                positions[i * 3] = point.x;
                positions[i * 3 + 1] = point.y;
                positions[i * 3 + 2] = point.z;
            });
            
            currentLine.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            currentLine.geometry.attributes.position.needsUpdate = true;
        }
        
        function onMouseUp() {
            isDrawing = false;
            currentLine = null;
        }
        
        // 添加事件监听器
        renderer.domElement.addEventListener('mousedown', onMouseDown);
        renderer.domElement.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 立方体动画
        function animateCube() {
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.007;
        }
        
        // 控制按钮功能
        document.getElementById('clear-btn').addEventListener('click', () => {
            lines.forEach(line => scene.remove(line));
            lines = [];
        });
        
        document.getElementById('toggle-grid').addEventListener('click', () => {
            gridHelper.visible = !gridHelper.visible;
        });
        
        document.getElementById('toggle-cube').addEventListener('click', () => {
            cube.visible = !cube.visible;
        });

        document.getElementById('toggle-controls').addEventListener('click', () => {
            if (controls) {
                destroyControls();
                document.getElementById('toggle-controls').textContent = '开启控制器';
            } else {
                createControls();
                document.getElementById('toggle-controls').textContent = '关闭控制器';
            }
        });
        
        // 颜色选择器
        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.color-option').forEach(el => el.classList.remove('active'));
                option.classList.add('active');
                drawColor = new THREE.Color(option.dataset.color);
            });
        });
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls && controls.update();
            animateCube();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
